<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}URBANOX{% endblock %}</title>
  <meta name="description" content="URBANOX — hip-hop streetwear con inventario real, drops vivos y trazabilidad propia/proveedor.">
  <meta name="theme-color" content="#eef0f4">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/ux.js') }}" defer></script>
</body>
</html>
